[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "serinctl"
version = "0.3.0"
description = "Tiny local Serin mini-split comfort controls"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
authors = [{name = "Chris Berry"}]
dependencies = ["websockets>=15,<16"]

[project.optional-dependencies]
dev = ["detect-secrets>=1.5,<2", "ruff>=0.9,<1"]

[project.scripts]
serinctl = "serinctl.cli:main"

[project.urls]
Homepage = "https://github.com/cnberry/serinctl"
Issues = "https://github.com/cnberry/serinctl/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
